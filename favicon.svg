<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="teleprompter">
  <style>
    .bg{fill:#e8dcc2}
    .t{fill:#2b2418}
    .s{fill:#6e2a1e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1a1611}
      .t{fill:#d9c9a7}
      .s{fill:#c8a14a}
    }
  </style>
  <rect class="bg" width="64" height="64"/>
  <text x="32" y="44" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace"
        font-weight="700" font-size="36" letter-spacing="-2">
    <tspan class="t">t</tspan><tspan class="s">§</tspan>
  </text>
</svg>
